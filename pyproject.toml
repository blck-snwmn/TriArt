[project]
name = "triart"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "blck-snwmn", email = "whitesnowmancreator@gmail.com" }
]
dependencies = [
    "opencv-python-headless==4.14.0.94",
    "numpy==2.5.4",
    "scipy==1.16.3",
    "matplotlib==3.11.2",
]
readme = "README.md"
requires-python = ">=3.14"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/triart"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.14.10",
]

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
